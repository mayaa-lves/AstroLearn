<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer">
    <script src="../public/js/components/recuperacao-link.js"></script>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Login · AstroLearn</title>
    <link href="../public/css/global.css" rel="stylesheet" />
    <link href="../public/css/pages/auth/login.css" rel="stylesheet" />
    <link
      as="image"
      href="../public/assets/imagens/login/cenarios-e-personagens/scene-cinematic-v5.png"
      rel="preload"
    />
    <link
      as="image"
      href="../public/assets/imagens/login/cenarios-e-personagens/alien-original-v20.png"
      rel="preload"
    />
  <link rel="icon" type="image/png" href="../public/assets/imagens/marca/astrolearn-simbolo.png">
  <link rel="stylesheet" href="../public/css/pages/auth/auth-tema.css?v=acesso-4">
  <script src="../public/js/pages/auth/login-tema-suave.js?v=2"></script>
<link rel="stylesheet" href="../public/css/pages/auth/login-refino.css?v=login-referencia-20">
<style>
#senha[type="text"] ~ #mostrar-senha .senha-risco{display:none}
::view-transition-old(root){animation:astro-sair 1s ease-in-out both}
::view-transition-new(root){animation:astro-entrar 1s ease-in-out both}
@keyframes astro-sair{from{opacity:1}to{opacity:0}}
@keyframes astro-entrar{from{opacity:0}to{opacity:1}}
html[data-visual-style=pixel] .login-page .scene-image{image-rendering:pixelated!important;filter:url(#pixel-definition) contrast(1.035)}
html[data-visual-style=pixel] .login-page .rocket img{image-rendering:pixelated!important;filter:none!important}
html[data-visual-style=pixel] .login-page .auth-appearance-actions{position:relative;isolation:isolate}
html[data-visual-style=pixel] .auth-appearance-actions::before{content:"";pointer-events:none;position:absolute;inset:-2rem -3rem;z-index:-1;background:radial-gradient(ellipse,#211c42c9 12%,#25213f80 52%,transparent 72%)}
html[data-visual-style=pixel] .login-header .signup-link{color:white!important;background:#28213dd6!important;border-color:#ebe3ffd9!important}
.pixel-eye-frame{display:none}
html[data-visual-style=pixel] #mascote :is(.mascot-pupil,.mascot-eyelid){display:none!important}
html[data-visual-style=pixel] #mascote:is([data-pose="normal"],[data-pose="aceno"]) .pixel-eye-frame{display:block;position:absolute;left:32%;top:31%;width:30%;height:28%;pointer-events:none;image-rendering:pixelated}
</style>
<link rel="stylesheet" href="../public/css/rolagem.css" data-astro-rolagem>
</head>
  <body class="login-page">
    <svg aria-hidden="true" width="0" height="0" style="position:absolute;pointer-events:none"><defs><filter id="pixel-definition" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="0 -0.12 0 -0.12 1.48 -0.12 0 -0.12 0" preserveAlpha="true"/></filter></defs></svg>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <!-- Cenário na tela inteira. -->
    <div aria-hidden="true" class="space-background">
      <div class="scene-canvas scene-image"></div>
      <div class="planet-light">
        <img
          alt=""
          src="../public/assets/imagens/login/cenarios-e-personagens/planet.png"
        />
      </div>
    </div>
    <header class="login-header">
      <a aria-label="AstroLearn, início" class="brand" href="../index.html">
        <img src="../public/assets/imagens/marca/astrolearn-livro-completa.svg" alt="AstroLearn" width="190" height="44" style="display:block;width:190px;max-width:100%;height:44px;object-fit:contain">
      </a>
      <div class="auth-appearance-actions"><button type="button" id="authStyleToggle" class="auth-style-toggle" title="Trocar estilo visual" aria-pressed="false" aria-label="Ativar estilo pixel art"><span class="auth-style-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 21C12 12 19 5 28 4c-1 9-8 16-17 17Z"/><circle cx="22" cy="10" r="2.5"/><path d="m12 13-5 1-3 6 8-1m7 1-1 7-6 3 1-9M8 24l-3 3m6-2-3 5M6 22l-4 3"/><path d="m13 20 3-3"/></svg></span><span data-style-label>Pixel art</span></button><a class="signup-link" href="cadastro-aluno.html">Criar conta</a></div>
    </header>
    <!-- Formulário sobre o cenário, sem uma janela ao redor. -->
    <main class="login-main" id="conteudo" tabindex="-1">
      <section aria-labelledby="login-title" class="login-content">
        <h1 id="login-title">
          Aprender é<br />
          <span>uma aventura.</span>
        </h1>
        <p class="intro">
          Investigue o universo. Experimente ideias.<br />
          Crie novas descobertas com sua equipe.
        </p>
        <form id="login-form" method="post" novalidate="">
          <label for="email">Seu e-mail</label>
          <div class="input-wrap">
            <svg aria-hidden="true" class="input-symbol" viewBox="0 0 24 24">
              <rect height="14" rx="2" width="18" x="3" y="5"></rect>
              <path d="m3 5 9 7 9-7"></path>
            </svg>
            <input
              aria-describedby="email-error"
              autocomplete="username"
              id="email"
              name="email"
              placeholder="Seu e-mail"
              required=""
              type="email"
            />
          </div>
          <p class="field-error" id="email-error" role="alert"></p>
          <label for="senha">Senha</label>
          <div class="input-wrap">
            <svg aria-hidden="true" class="input-symbol" viewBox="0 0 24 24">
              <rect height="11" rx="3" width="14" x="5" y="10"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <input
              aria-describedby="senha-error"
              autocomplete="current-password"
              id="senha"
              name="senha"
              placeholder="Sua senha"
              required=""
              type="password"
            />
            <button
              aria-label="Mostrar senha"
              aria-pressed="false"
              class="reveal-button"
              id="mostrar-senha"
              type="button"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                <path class="senha-risco" d="M3 3L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
              </svg>
            </button>
          </div>
          <p class="field-error" id="senha-error" role="alert"></p>
          <div class="form-options">
            
            <a href="recuperar-senha.html">Esqueci minha senha</a>
          </div>
          <button class="primary-button" id="entrar" type="submit">
            Entrar na plataforma
            <span aria-hidden="true">→</span>
          </button>
          <p aria-live="polite" id="login-status" role="status"></p>
        </form>
        <p class="register-line">
          Ainda não tem uma conta?
          <a href="cadastro-aluno.html">Cadastre-se</a>
        </p>
      </section>
    </main>
    <!-- O PNG do ET contém três poses, em três colunas. -->
    <section aria-label="Explore o cenário" class="space-interactions">
      <div class="scene-canvas interaction-canvas">
        <span aria-hidden="true" class="contact-shadow"> </span>
        <button
          aria-label="Fazer o ET acenar"
          class="mascot"
          data-pose="normal"
          id="mascote"
          type="button"
        >
          <span aria-hidden="true" class="mascot-sprite"> </span>
          <span aria-hidden="true" class="mascot-pupil"> </span>
          <canvas class="pixel-eye-frame" width="54" height="50" aria-hidden="true"></canvas>
          <svg aria-hidden="true" class="mascot-eyelid" viewBox="0 0 100 100">
            <ellipse cx="50" cy="50" fill="#b687de" rx="46" ry="45"></ellipse>
            <path
              d="M10 52Q50 66 90 52"
              fill="none"
              stroke="#57356e"
              stroke-linecap="round"
              stroke-width="5"
            ></path>
          </svg>
        </button>
        <p
          aria-live="polite"
          class="mascot-message"
          id="mascot-message"
          role="status"
        ></p>
        <button
          aria-label="Testar a decolagem do foguete"
          class="rocket"
          id="foguete"
          type="button"
        >
          <img
            alt=""
            src="../public/assets/imagens/login/cenarios-e-personagens/rocket.png"
          />
          <span aria-hidden="true" class="rocket-flame"> </span>
        </button>
        <button
          aria-label="Curiosidade sobre Vênus"
          class="discovery-star star-one"
          data-curiosidade="Vênus leva cerca de 243 dias terrestres para girar uma vez e cerca de 225 para completar uma órbita ao redor do Sol."
          type="button"
        >
          ✦
        </button>
        <button
          aria-label="Curiosidade sobre o espaço"
          class="discovery-star star-two"
          data-curiosidade="O som precisa de um meio para se propagar. No vácuo, astronautas usam ondas de rádio para conversar."
          type="button"
        >
          ✧
        </button>
        <button
          aria-label="Curiosidade sobre robótica"
          class="discovery-star star-three"
          data-curiosidade="Robôs exploradores usam câmeras, sensores e programação para investigar Marte e enviar descobertas à Terra."
          type="button"
        >
          ✦
        </button>
      </div>
    </section>
    <footer class="login-footer">
      <span>Aprenda. Explore. Vá além.</span>
      <div class="login-scene-controls"><button aria-label="Pausar movimentos" aria-pressed="false" id="pausar-movimentos" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><g class="pause-glyph"><rect x="5" y="3" width="5" height="18" rx="2"/><rect x="14" y="3" width="5" height="18" rx="2"/></g><path class="play-glyph" d="m8 4 12 8-12 8z"/></svg>
      </button></div>
    </footer>
    <dialog aria-labelledby="curiosidade-title" id="curiosidade">
      <h2 id="curiosidade-title">Uma descoberta para sua órbita</h2>
      <p id="curiosidade-text"></p>
      <button class="primary-button" id="fechar-curiosidade" type="button">
        Entendi
      </button>
    </dialog>
    <script src="../public/js/pages/auth/login.js" type="module"></script>
  <script type="module" src="../public/js/pages/auth/login-asteroides.js?v=5"></script><script type="module" src="../public/js/pages/auth/login-olho-pixel.js"></script></body>
</html>
