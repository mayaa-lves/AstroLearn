<main id="main" tabindex="-1">
  <header class="teacher-top"><span class="mode">ÁREA DO PROFESSOR</span></header>
  <nav class="breadcrumbs" aria-label="Caminho da página">
    <a href="home.html">Turmas</a><span>/</span><a id="gamesRoomLink">Minha turma</a><span>/ Jogos</span>
  </nav>
  <section class="page-heading">
    <h1>Jogos da turma</h1>
    <p>Defina quando os alunos podem acessar os jogos.</p>
  </section>
  <div class="page-actions games-navigation"><a id="gamesBackLink" class="secondary" href="home.html">← Voltar às turmas</a></div>
  <div class="games-workspace">
    <section class="panel games-access" aria-labelledby="gamesAccessTitle">
      <div class="games-access-heading">
        <h2 id="gamesAccessTitle">Acesso aos jogos</h2>
        <span id="gamesAccessBadge" class="games-access-badge" data-state="loading">Consultando</span>
      </div>
      <form id="accessForm" aria-busy="true">
        <label class="games-toggle">
          <input id="allowGames" type="checkbox" role="switch" disabled aria-describedby="gamesAccessHint">
          <span class="games-switch" aria-hidden="true"></span>
          <span>Liberar jogos para esta turma</span>
        </label>
        <p id="gamesAccessHint">Consulte e ajuste o acesso dos alunos desta turma.</p>
        <p id="accessMessage" role="status" aria-live="polite">Consultando configuração…</p>
        <div class="games-actions">
          <button id="refreshAccess" class="games-refresh" type="button" aria-label="Atualizar acesso">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 0 0-14-5L3 8m0-5v5h5M4 14a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></svg>
            <span>Atualizar</span>
          </button>
          <button class="primary" id="saveAccess" type="submit" disabled>Salvar alterações</button>
        </div>
      </form>
    </section>
    <figure class="games-controller-stage" aria-label="Controle de jogos tridimensional girando sobre o próprio eixo">
      <div class="games-controller-hover">
        <canvas id="gamesController" aria-hidden="true"></canvas>
      </div>
      <div class="games-plinth" aria-hidden="true"></div>
    </figure>
  </div>
