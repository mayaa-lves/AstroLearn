<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>html.astro-teacher-loading{background:#fcf6f2}html.astro-teacher-loading body{visibility:hidden}html.astro-teacher-loading #teacherLoader{visibility:visible}#teacherLoader{position:fixed;inset:0;z-index:10000;display:grid;place-content:center;justify-items:center;gap:16px;background:radial-gradient(ellipse at 75% 0,#eadcf8,transparent 65%),#fcf6f2;color:#503267;font:15px/1.5 Arial,sans-serif}#teacherLoader[hidden]{display:none}#teacherLoader img{width:72px;height:72px;object-fit:contain}#teacherLoader .loader-orbit{width:30px;height:30px;border:2px solid #e0cdeb;border-top-color:#8b3cc4;border-radius:50%;animation:teacher-loading-spin 1s linear infinite}@keyframes teacher-loading-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#teacherLoader .loader-orbit{animation:none}}</style>
    <script>document.documentElement.classList.add('astro-teacher-loading');</script>
    <script defer src="../public/js/components/professor-carregamento.js?v=1"></script>
    <link rel="stylesheet" href="../public/css/professor-menu-padrao.css?v=1">

    
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Desenvolvimento do aluno · AstroLearn</title>
    <meta
      content="Turmas, atividades e acompanhamento dos alunos no AstroLearn."
      name="description"
    />
    <link href="../public/css/aluno-pdf.css" rel="stylesheet" />
    <link href="../public/css/professor.css" rel="stylesheet" />
    <link href="../public/css/menu-professor.css" rel="stylesheet" />
    <link href="../public/css/preferencias.css" rel="stylesheet" />
    <link rel="stylesheet" href="../public/css/menu-unificado.css">
  <script defer src="../public/js/components/menu-professor-perfil.js?v=2"></script>
<link rel="icon" type="image/png" href="../public/assets/imagens/marca/astrolearn-simbolo.png">
<link rel="stylesheet" href="../public/css/rolagem.css" data-astro-rolagem>
  <link rel="stylesheet" href="../public/css/professor-correcoes.css?v=2">
  <link rel="stylesheet" href="../public/css/professor-historico.css?v=3">
<link rel="stylesheet" href="../public/css/professor-correcoes-padrao.css?v=1">
<script defer src="../public/js/components/professor-correcoes-padrao.js?v=1"></script>
</head>
  <body data-page="student">
    <a class="skip" href="#main">Pular para o conteúdo</a>
    <aside class="sidebar">
      <a class="brand" href="home.html" id="brandHome"
        ><svg aria-hidden="true" viewbox="0 0 40 40">
          <circle cx="20" cy="20" r="9"></circle>
          <ellipse
            cx="20"
            cy="20"
            rx="18"
            ry="6"
            transform="rotate(-28 20 20)"
          ></ellipse></svg
        >Astro<span>Learn</span></a
      ><button
        aria-controls="mainNav"
        aria-expanded="true"
        aria-label="Recolher menu"
        id="menuToggle"
      >
        ‹‹
      </button>
      <nav aria-label="Menu do professor" id="mainNav"></nav>
      <div class="side-bottom">
        <button class="text-button" id="help">
          ? <span class="label">Ajuda</span></button
        ><a href="../auth/login.html" id="exit"
          >← <span class="label">Voltar ao login</span></a
        >
      </div>
    </aside>
    <div class="history-aurora" aria-hidden="true"><span></span><span></span></div>
    <main id="main" tabindex="-1">
      <div class="sr-only" id="frontend-local-banner">
        Demonstração local do professor.
      </div>
      <header class="teacher-top">
        <span class="mode" id="mode">ESTAÇÃO DO PROFESSOR</span>
        <div>
          <a
            aria-label="Notificações"
            class="notice-bell"
            href="notificacoes.html"
            id="noticeBell"
            ><svg aria-hidden="true" viewbox="0 0 24 24">
              <path
                d="M18 8a6 6 0 0 0-12 0c0 8-3 7-3 10h18c0-3-3-2-3-10M10 21h4"
              ></path></svg
            ><span hidden="" id="noticeCount">0</span></a
          ><button class="text-button" id="refresh">↻ Atualizar</button
          ><button class="text-button" id="topExit">Voltar ao login</button>
        </div>
      </header>
      <nav
        aria-label="Caminho da página"
        class="breadcrumbs"
        id="breadcrumbs"
      ></nav>
      <section class="page-heading">
        <p class="eyebrow">ENSINAR É ABRIR NOVOS MUNDOS</p>
        <h1 id="pageTitle" tabindex="-1">Suas turmas.</h1>
        <p id="pageSubtitle">Cada sala, uma nova expedição.</p>
        <div class="page-actions" id="pageActions"></div>
      </section>
      <p class="mode-note" id="modeNote"></p>
      <p class="error-panel" id="error" role="alert"></p>
      <p aria-live="polite" class="status" id="status" role="status"></p>
      <div aria-busy="true" id="content">
        <p class="empty">Preparando sua estação…</p>
      </div>
      <footer>AstroLearn · Uma descoberta de cada vez.</footer>
    </main>
    <dialog aria-labelledby="dialogTitle" id="actionDialog">
      <button aria-label="Fechar" class="close" id="closeDialog">×</button>
      <h2 id="dialogTitle"></h2>
      <div id="dialogContent"></div>
      <p id="dialogError" role="alert"></p>
    </dialog>
    <script src="../public/js/components/professor-dados.js"></script>
    <script src="../public/js/components/professor-paginas.js"></script>
    <script src="../public/js/components/assistente-professor.js?v=1"></script>
<script src="../public/js/components/preferencias.js"></script>
    
    
    <script
      data-page-entry=""
      src="../public/js/pages/professor/aluno.js"
    ></script>
  <script defer src="../public/js/pages/professor/fluxo-correcoes.js?v=3"></script>
  <script type="module" src="../public/js/components/sessao.js"></script>
<script type="module" src="../public/js/components/professor-padrao.js?v=3"></script>
<script type="module" src="../public/js/components/professor-perfil-vinculo.js?v=3"></script>
  <script defer src="../public/js/pages/professor/historico-visual.js?v=1"></script>
</body>
</html>
