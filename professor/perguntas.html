<style data-astro-startup>html.astro-page-loading{background:#fcf8f5}html.astro-page-loading body{visibility:hidden}html.astro-page-loading #astroPageLoader{visibility:visible}</style>
<script data-astro-startup>document.documentElement.classList.add('astro-page-loading');setTimeout(function(){document.documentElement.classList.remove('astro-page-loading','astro-teacher-loading');var layer=document.getElementById('astroPageLoader');if(layer)layer.remove();},18000);</script>

  <body data-page="questions" class="teacher-finish">
    <a class="skip" href="#main">Pular para o conteúdo</a>
    <aside class="sidebar">
      <a class="brand" href="home.html" id="brandHome"
        ><svg aria-hidden="true" viewbox="0 0 40 40">
          <circle cx="20" cy="20" r="9"></circle>
          <ellipse
            cx="20"
            cy="20"
            rx="18"
            ry="6"
            transform="rotate(-28 20 20)"
          ></ellipse></svg
        >Astro<span>Learn</span></a
      ><button
        aria-controls="mainNav"
        aria-expanded="true"
        aria-label="Recolher menu"
        id="menuToggle"
      >
        ‹‹
      </button>
      <nav aria-label="Menu do professor" id="mainNav"></nav>
      <div class="side-bottom">
        <button class="text-button" id="help">
          ? <span class="label">Ajuda</span></button
        ><a href="../auth/login.html" id="exit"
          >← <span class="label">Voltar ao login</span></a
        >
      </div>
    </aside>
    <div class="questions-scenery" aria-hidden="true">
      <div class="questions-signal-canvas">
        <div class="questions-signal"><span></span><span></span><span></span></div>
      </div>
    </div>
    <main id="main" tabindex="-1">
      <div class="sr-only" id="frontend-local-banner">
        Demonstração local do professor.
      </div>
      <header class="teacher-top">
        <span class="mode" id="mode">ESTAÇÃO DO PROFESSOR</span>
        <div>
          <a
            aria-label="Notificações"
            class="notice-bell"
            href="notificacoes.html"
            id="noticeBell"
            ><svg aria-hidden="true" viewbox="0 0 24 24">
              <path
                d="M18 8a6 6 0 0 0-12 0c0 8-3 7-3 10h18c0-3-3-2-3-10M10 21h4"
              ></path></svg
            ><span hidden="" id="noticeCount">0</span></a
          ><button class="text-button" id="refresh">↻ Atualizar</button
          ><button class="text-button" id="topExit">Voltar ao login</button>
        </div>
      </header>
      <nav
        aria-label="Caminho da página"
        class="breadcrumbs"
        id="breadcrumbs"
      ></nav>
      <section class="page-heading">
        <p class="eyebrow">ENSINAR É ABRIR NOVOS MUNDOS</p>
        <h1 id="pageTitle" tabindex="-1">Perguntas da turma</h1>
        <p id="pageSubtitle">Converse com os alunos e acompanhe as respostas.</p>
        <div class="page-actions" id="pageActions"></div>
      </section>
      <p class="mode-note" id="modeNote"></p>
      <p class="error-panel" id="error" role="alert"></p>
      <p aria-live="polite" class="status" id="status" role="status"></p>
      <div aria-busy="true" id="content">
        <p class="empty">Preparando sua estação…</p>
      </div>
      <footer class="questions-page-footer">
        <a href="home.html">
          <img src="../public/assets/imagens/marca/astrolearn-simbolo.png" alt="" />
          AstroLearn
        </a>
        <span>Uma descoberta de cada vez.</span>
      </footer>
    </main>
    <dialog aria-labelledby="dialogTitle" id="actionDialog">
      <button aria-label="Fechar" class="close" id="closeDialog">×</button>
      <h2 id="dialogTitle"></h2>
      <div id="dialogContent"></div>
      <p id="dialogError" role="alert"></p>
    </dialog>
